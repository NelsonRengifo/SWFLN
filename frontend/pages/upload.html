<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <title>Upload Management</title>

  <link rel="stylesheet" href="/frontend/styles/base.css">
  <link rel="stylesheet" href="/frontend/styles/dashboard.css">
  <link rel="stylesheet" href="/frontend/styles/forms.css">

  <script type="module" src="/frontend/src/pages/upload.js" defer></script>

</head>

<body>

<header class="app-header">

  <h1>Upload Management</h1>

  <nav>
    <a href="dashboard.html">Dashboard</a>
  </nav>

</header>


<main class="page-container">


<!-- ================================= -->
<!-- FILE UPLOAD SECTION -->
<!-- ================================= -->

<section class="card-section">

  <h2>Upload CSV File</h2>

  <div class="upload-controls">

    <input type="file" id="csvFile" accept=".csv">

    <select id="source">
      <option value="libcal">LibCal</option>
      <option value="niche">Niche</option>
      <option value="myturn">MyTurn</option>
    </select>

    <button id="uploadBtn">
      Upload File
    </button>

  </div>

</section>


<!-- ================================= -->
<!-- UPLOAD HISTORY -->
<!-- ================================= -->

<section class="card-section">

  <h2>Upload History</h2>

  <div id="uploadHistory">
    Loading uploads...
  </div>

</section>


<!-- ================================= -->
<!-- PROCESSING LOGS -->
<!-- ================================= -->

<section class="card-section">

  <h2>Processing Logs</h2>

  <div id="processingLogs">
    Loading logs...
  </div>

</section>


<!-- ================================= -->
<!-- TRANSFORM STATUS -->
<!-- ================================= -->

<section class="card-section">

  <h2>Transform Status</h2>

  <div id="transformStatus">
    Loading transform status...
  </div>

</section>


<!-- ================================= -->
<!-- INGESTION STATUS -->
<!-- ================================= -->

<section class="card-section">

  <h2>Ingestion Status</h2>

  <div id="ingestionStatus">
    Loading ingestion status...
  </div>

</section>


</main>

</body>
</html>
