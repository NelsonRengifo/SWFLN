<!--Accounts Page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>Accounts</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/forms.css" />
  <script type="module" src="/frontend/src/pages/account.js" defer></script>
</head>

<body>

<div class="app-layout">

  <div id="sidebar"></div>

  <div class="app-content">

    <main class="main-content">

      <h1 class="page-title">Account Settings</h1>

      <div class="settings-grid">

        <!-- PASSWORD CARD -->
        <section class="card">
          <h2>Update Password</h2>

          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" />
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" />
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" />
          </div>

          <button id="updatePasswordBtn">Update Password</button>
        </section>

        <!-- USERNAME CARD -->
        <section class="card">
          <h2>Update Username</h2>

          <div class="form-group">
            <label>New Username</label>
            <input type="text" id="newUsername" />
          </div>

          <div class="form-group">
            <label>Confirm New Username</label>
            <input type="text" id="confirmUsername" />
          </div>

          <button id="updateUsernameBtn">Update Username</button>
        </section>

        <!-- USERS MANAGEMENT -->
        <section class="card full-width">
          <h2>Manage Users</h2>

          <div class="table-wrapper">
            <div id="usersTable">
              <p>Loading users...</p>
            </div>
          </div>

          <button id="deleteSelectedUsersBtn" style="margin-top:10px;">
            Delete Selected Users
          </button>
        </section>

      </div>

    </main>
  </div>
</div>

</body>
</html>
