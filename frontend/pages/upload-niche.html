<!--Niche Upload-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>Niche Upload</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/upload.css" />

  <script type="module" src="/frontend/src/pages/upload-niche.js" defer></script>
</head>

<body>

<div class="app-layout">

<!-- SIDEBAR -->
<div id="sidebar"></div>

  <div class="app-content">

    <header class="app-header">
      <h1>Niche Upload</h1>
      <a href="dashboard.html">← Back to Dashboard</a>
    </header>



    <main class="upload-page">

      <div class="upload-card">
        <h2>Upload Niche CSV</h2>

        <input type="file" id="fileInput" accept=".csv" />

        <button id="uploadBtn">Upload File</button>

        <p id="statusMsg"></p>
      </div>

    </main>

    <section class="table-container">
      <h2>Manage Uploaded Files</h2>

      <div style="margin-bottom: 10px;">
        <button id="loadFilesBtn">Load Files</button>
        <button id="deleteBtn">Delete Selected</button>
      </div>

      <div id="filesTable">
        <p>No files loaded</p>
      </div>
    </section>
  </div>
</div>
</body>
</html>
