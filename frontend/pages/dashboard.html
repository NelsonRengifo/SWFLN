<!-- Dashboard Page -->
<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>SWFLN Dashboard</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/dashboard.css" />

  <script type="module" src="/frontend/src/pages/dashboard.js" defer></script>
</head>

<body>

<div class="app-layout">

  <div id="sidebar"></div>

  <div class="app-content">

    <main class="main-content">

      <h1 class="auth-title">Live Dashboard</h1>

      <div class="dashboard-grid">

        <div class="section-card">
          <div class="section-header">Top Tutorials</div>
          <div id="tutorialsTable"></div>
        </div>

        <div class="section-card">
          <div class="section-header">Top Items</div>
          <div id="itemsTable"></div>
        </div>

        <div class="section-card">
          <div class="section-header">Top Organizations</div>
          <div id="orgsTable"></div>
        </div>

        <div class="section-card">
          <div class="section-header">Tutorial Views (Last 365 Days)</div>
          <div id="viewsTable"></div>
        </div>

        <div class="section-card full-width">
          <div class="section-header">Total Events</div>
          <div id="eventsTable"></div>
        </div>

      </div>

    </main>
  </div>
</div>
</body>
</html>
