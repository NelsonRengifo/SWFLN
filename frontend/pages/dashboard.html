<!-- Dashboard Page -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SWFLN Dashboard</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/dashboard.css" />

  <script type="module" src="/frontend/src/pages/dashboard.js" defer></script>
</head>

<body>

<!-- ===================== -->
<!-- SIDEBAR -->
<!-- ===================== -->
<aside class="sidebar">

  <div class="sidebar-icon" data-label="Dashboard">🏠</div>

  <div class="sidebar-icon" id="openUploads" data-label="Uploads">
    📤
  </div>

  <div class="sidebar-icon" data-label="Reports" onclick="location.href='reports.html'">
    📊
  </div>

  <div class="sidebar-icon" id="openSettings" data-label="Settings">
    ⚙️
  </div>

  <div class="sidebar-icon" data-label="Register User" onclick="location.href='register.html'">
    👤
  </div>

</aside>


<!-- ===================== -->
<!-- HEADER -->
<!-- ===================== -->
<header class="app-header">
  <h1>SWFLN Admin Dashboard</h1>

  <button id="logoutBtn" class="logout-btn">
    Logout
  </button>
</header>


<!-- ===================== -->
<!-- MAIN CONTENT -->
<!-- ===================== -->
<main class="main-content">

  <!-- METRICS -->
  <section class="metrics-grid">

    <div class="metric-card">
      <h3>Tutorial Views</h3>
      <p id="viewsMetric">--</p>
    </div>

    <div class="metric-card">
      <h3>Event Counts</h3>
      <p id="eventsMetric">--</p>
    </div>

    <div class="metric-card">
      <h3>Top Item</h3>
      <p id="itemsMetric">--</p>
    </div>

    <div class="metric-card">
      <h3>Top Organization</h3>
      <p id="orgsMetric">--</p>
    </div>

  </section>


  <!-- TOP TUTORIALS TABLE -->
  <section class="report-section">
    <h2>Top Tutorials</h2>

    <div id="reportContent">
      <p>Loading...</p>
    </div>
  </section>

</main>


<!-- ===================== -->
<!-- SLIDE PANEL -->
<!-- ===================== -->
<div id="sidePanel" class="side-panel hidden">

  <div class="panel-header">
    <h3 id="panelTitle">Panel</h3>
    <button id="closePanel">✖</button>
  </div>

  <div id="panelContent"></div>

</div>

</body>
</html>
