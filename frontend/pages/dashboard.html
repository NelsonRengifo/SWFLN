<!-- Dashboard Page -->
<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>SWFLN Dashboard</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/dashboard.css" />

  <script type="module" src="/frontend/src/pages/dashboard.js" defer></script>
</head>

<body>

<div class="app-layout">

  <div id="sidebar"></div>

  <div class="app-content">

    <!-- ===================== -->
    <!-- HEADER -->
    <!-- ===================== -->
    <header class="app-header">
      <h1>SWFLN Admin Dashboard</h1>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </header>

    <!-- ===================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================== -->
    <main class="main-content">

      <!-- METRICS -->
      <section class="metrics-grid">

        <div class="metric-card">
          <h3>Tutorial Views</h3>
          <p id="viewsMetric">--</p>
        </div>

        <div class="metric-card">
          <h3>Event Counts</h3>
          <p id="eventsMetric">--</p>
        </div>

        <div class="metric-card">
          <h3>Top Item</h3>
          <p id="itemsMetric">--</p>
        </div>

        <div class="metric-card">
          <h3>Top Organization</h3>
          <p id="orgsMetric">--</p>
        </div>

      </section>

      <!-- TOP TUTORIALS TABLE -->
      <section class="report-section">
        <h2>Top Tutorials</h2>
        <div id="reportContent">
          <p>Loading...</p>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
