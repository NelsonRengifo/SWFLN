<!--Dashboard Page-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SWFLN Dashboard</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/dashboard.css" />

  <script type="module" src="/frontend/src/pages/dashboard.js" defer></script>
</head>

<body>

<header class="app-header">
  <h1>SWFLN Admin Dashboard</h1>

  <button id="logoutBtn" class="logout-btn">
    Logout
  </button>
</header>

<main>

  <!-- Dashboard Cards -->
  <section class="dashboard-grid">

    <a class="card" href="reports.html">
      <h2>Top Tutorials</h2>
      <p>View Most Popular Tutorials</p>
    </a>

    <a class="card" href="upload.html">
      <h2>Upload Management</h2>
      <p>Manage Uploads, View History, and Monitor Processing</p>
    </a>

  </section>

  <!-- Upload Section -->
  <section class="upload-section">

    <h2>Quick CSV Upload</h2>

    <p class="upload-desc">Upload a dataset directly from the dashboard</p>
    
    <div class="upload-controls">

      <input type="file" id="csvFile" accept=".csv" />

      <select id="source">
        <option value="libcal">LibCal</option>
        <option value="niche">Niche</option>
        <option value="myturn">MyTurn</option>
      </select>

      <button id="uploadBtn">
       Upload File
      </button>
    </div>
  </section>

  <!-- Report Section -->
  <section id="reportSection" class="report-section hidden">
    <h2 id="reportTitle"></h2>
    <div id="reportContent"></div>
  </section>

</main>

</body>
</html>
