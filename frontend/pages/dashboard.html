<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>SWFLN Dashboard</title>

```
<link rel="stylesheet" href="/frontend/styles/base.css" />
<link rel="stylesheet" href="/frontend/styles/dashboard.css" />

<script type="module" src="/frontend/src/pages/dashboard.js" defer></script>
```

  </head>

  <body>

```
<header class="app-header">
  <h1>SWFLN Admin Dashboard</h1>

  <button id="logoutBtn" class="logout-btn">
    Logout
  </button>
</header>

<main class="dashboard">

  <section class="dashboard">

    <a class="card" href="reports.html">
      <h3>Top Tutorials</h3>
      <p>View most popular tutorials</p>
    </a>

    <a class="card" href="upload.html">
      <h3>Upload CSV</h3>
      <p>Upload new dataset</p>
    </a>

  </section>

  <section class="cards">
    <button id="loadTutorialsBtn" class="card">
      <h2>Top Tutorials</h2>
      <p>View most viewed tutorials</p>
    </button>
  </section>

  <section class="upload-section">
    <h2>Upload CSV File</h2>

    <input type="file" id="csvFile" accept=".csv" />

    <select id="source">
      <option value="libcal">LibCal</option>
      <option value="niche">Niche</option>
      <option value="myturn">MyTurn</option>
    </select>

    <button id="uploadBtn">
      Upload File
    </button>
  </section>

  <section id="reportSection" class="report-section hidden">
    <h2 id="reportTitle"></h2>
    <div id="reportContent"></div>
  </section>

</main>
```

  </body>

</html>
