<!--Libcal Uploads-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>LibCal Upload</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/upload.css" />

  <script type="module" src="/frontend/src/pages/upload-libcal.js" defer></script>
</head>

<body>
<div class="app-layout">
    <!-- SIDEBAR -->
    <div id="sidebar"></div>

    <div class="app-content">

    <header class="app-header">
      <h1>LibCal Upload</h1>
      <a href="dashboard.html">← Back to Dashboard</a>
    </header>

    <main class="upload-page">
      <div class="upload-card">
        <h2>Upload LibCal CSV</h2>

        <input type="file" id="fileInput" accept=".csv" />
        <button id="uploadBtn">Upload File</button>

        <p id="statusMsg"></p>
      </div>
    </main>

    <section class="table-container">
      <h2>Manage Uploaded Files</h2>

      <div style="margin-bottom: 10px;">
        <button id="loadFilesBtn">Load Files</button>
        <button id="deleteBtn">Delete Selected</button>
      </div>

      <div id="filesTable">
        <p>No files loaded</p>
      </div>
    </section>
  </div>
</div>

</body>
</html>
