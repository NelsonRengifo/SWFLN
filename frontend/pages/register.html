<!--Registration Page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>Register User</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/forms.css" />
</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- MAIN CONTENT -->
  <div class="app-content">

    <main class="main-content">

      <div class="auth-container">
        <div class="auth-card">

          <h2 class="auth-title">Create User</h2>

          <form id="registerForm" class="auth-form">

            <input type="text" id="firstName" placeholder="First Name" required />
            <input type="text" id="lastName" placeholder="Last Name" required />
            <input type="text" id="username" placeholder="Username" required />
            <input type="email" id="email" placeholder="Email" required />
            <input type="password" id="password" placeholder="Password (More Than 8 Characters)" required />

            <select id="role" required>
              <option value="">Select Role</option>
              <option value="admin">Admin</option>
              <option value="super admin">Super Admin</option>
            </select>

            <button type="submit" class="primary-btn">Create User</button>

          </form>

        </div>
      </div>

    </main>

  </div>

</div>

<script type="module" src="/frontend/src/pages/register.js"></script>

</body>
</html>
