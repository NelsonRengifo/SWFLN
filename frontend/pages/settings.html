<!--Settings Page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>Settings</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/forms.css" />
  <script type="module" src="/frontend/src/pages/settings.js" defer></script>
</head>

<body>

<div class="app-layout">

  <div id="sidebar"></div>

  <div class="app-content">

    <main class="main-content">

      <!-- UPDATE PASSWORD -->
      <section>
        <h2>Update Password</h2>

        <input type="password" id="currentPassword" placeholder="Current Password" />
        <input type="password" id="newPassword" placeholder="New Password" />

        <button id="updatePasswordBtn">Update Password</button>
      </section>

      <hr/>

      <!-- UPDATE USERNAME -->
      <section>
        <h2>Update Username</h2>

        <input type="text" id="newUsername" placeholder="New Username" />

        <button id="updateUsernameBtn">Update Username</button>
      </section>

    </main>
  </div>
</div>

</body>
</html>
