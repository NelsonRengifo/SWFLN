<!--Reports Page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>Reports</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/forms.css" />
</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- MAIN CONTENT -->
  <div class="app-content">

    <header class="app-header">
      <h1>Reports</h1>
      <a href="dashboard.html">← Back to Dashboard</a>
    </header>

    <main class="main-content">

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active" data-type="tutorials">Top Tutorials</button>
        <button class="tab" data-type="views">Tutorial Views</button>
        <button class="tab" data-type="events">Event Counts</button>
        <button class="tab" data-type="items">Top Items</button>
        <button class="tab" data-type="orgs">Top Organizations</button>
      </div>

      <!-- FILTERS -->
      <section class="filters">

        <label>
          Limit
          <input type="number" id="limit" value="10" />
        </label>

        <label>
          Start Date
          <input type="date" id="startDate" />
        </label>

        <label>
          End Date
          <input type="date" id="endDate" />
        </label>

        <button id="loadReportBtn">Load Report</button>

      </section>

      <!-- RESULTS -->
      <section class="table-container">
        <div id="reportContent"></div>
      </section>

    </main>

  </div>
  
</div>

<script type="module" src="../src/pages/reports.js"></script>

</body>
</html>
