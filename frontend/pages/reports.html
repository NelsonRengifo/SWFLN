<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reports</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/dashboard.css" />
</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div id="sidebar"></div>

  <!-- MAIN CONTENT -->
  <div class="app-content">

    <header class="app-header">
      <h1>Reports</h1>
      <a href="dashboard.html">← Back to Dashboard</a>
    </header>

    <main class="main-content">

      <section class="filters">

        <label>
          Limit
          <input type="number" id="limit" value="10" />
        </label>

        <label>
          Start Date
          <input type="date" id="startDate" />
        </label>

        <label>
          End Date
          <input type="date" id="endDate" />
        </label>

        <button id="loadReportBtn">Load Report</button>

      </section>

      <section class="table-container">
        <div id="reportContent"></div>
      </section>

    </main>

  </div>
  
</div>

<script type="module" src="../src/pages/reports.js"></script>

</body>
</html>
