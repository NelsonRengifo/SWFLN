<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="../styles/forms.css" />
</head>
<body>

  <!-- ===================== -->
  <!-- SIDEBAR -->
  <!-- ===================== -->
  <div id="sidebar"></div>

  <div class="container">
    <h2>Reset Password</h2>

    <form id="resetForm">

      <input 
        type="text" 
        id="token" 
        placeholder="Reset Token" 
        required 
      />

      <input 
        type="password" 
        id="newPassword" 
        placeholder="New Password" 
        required 
      />

      <input 
        type="password" 
        id="confirmPassword" 
        placeholder="Confirm Password" 
        required 
      />

      <button type="submit">Reset Password</button>
    </form>

    <p>
      Back to <a href="./login.html">Login</a>
    </p>
  </div>

  <script type="module" src="../src/pages/reset-password.js"></script>
</body>
</html>
