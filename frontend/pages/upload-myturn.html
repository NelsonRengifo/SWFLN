<!--MyTurn Uploads-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>MyTurn Upload</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/upload.css" />

  <script type="module" src="/frontend/src/pages/upload-myturn.js" defer></script>
</head>

<body>
<div class="app-layout">
<!-- SIDEBAR -->
<div id="sidebar"></div>

  <div class="app-content">

    <main class="upload-page">
      <div class="upload-card">
        <h2>Upload MyTurn CSV</h2>

        <input type="file" id="fileInput" accept=".csv" />
        <button id="uploadBtn">Upload File</button>

        <p id="statusMsg"></p>
      </div>
    </main>
    
    <section class="card table-card">

      <div class="card-header">
        <h2>Manage Uploaded Files</h2>

        <div class="card-actions">
          <button id="loadFilesBtn">Load Files</button>
          <button id="deleteBtn" class="danger-btn">Delete Selected</button>
        </div>
      </div>

      <div id="filesTable">
        <p>No files loaded</p>
      </div>

    </section>
  </div>
</div>
</body>
</html>
