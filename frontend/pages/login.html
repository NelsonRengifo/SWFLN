<!--Login Page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SWFLN Login</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/forms.css" />

  <script type="module" src="/frontend/src/pages/login.js" defer></script>
</head>
<body>

<main class="login-container">
  <h1>SWFLN Reporting Dashboard</h1>

  <form id="loginForm" class="login-form">
    <label>
      Username
      <input type="text" id="username" required />
    </label>

    <label>
      Password
      <input type="password" id="password" required />
    </label>

    <button type="submit">Login</button>

    <p id="errorMsg" class="error hidden"></p>
  </form>
</main>

</body>
</html>
