<!--Login Page-->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/frontend/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicon/favicon-16x16.png">
  <link rel="manifest" href="/frontend/favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <title>SWFLN Login</title>

  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/forms.css" />

  <script type="module" src="/frontend/src/pages/login.js" defer></script>
</head>
<body>

<main class="login-container">
  <h1>SWFLN Reporting Dashboard</h1>

  <form id="loginForm" class="login-form">
    <label>
      Username
      <input type="text" id="username" required />
    </label>

    <label>
      Password
      <input type="password" id="password" required />
    </label>

    <button type="submit">Login</button>

    <div class="form-link">
      <a href="./forgot-password.html">Forgot Password?</a>
    </div>

    <p class="auth-link">
      <a href="#" id="forgotUsernameLink">Forgot Username?</a>
    </p>

    <p id="errorMsg" class="error hidden">Incorrect Password</p>
  </form>
</main>

</body>
</html>
